<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girodireccional</title>

  <style>
    :root {
      --panel: #252525;
      --bezel: #111;
      --face: #202020;
      --mark: #f3f3f3;
      --aircraft: #eeeeee;
      --accent: #d8d8d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ececec;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .card {
      width: min(94vw, 520px);
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .instrument {
      position: relative;
      width: min(82vw, 390px);
      aspect-ratio: 1;
      margin: 0 auto 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 48% 42%, #484848 0%, #282828 48%, #111 72%, #050505 100%);
      border: 15px solid #242424;
      box-shadow:
        inset 0 0 0 4px #050505,
        inset 0 0 20px rgba(255,255,255,0.10),
        0 5px 14px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .instrument::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.75);
      z-index: 20;
    }

    #compassCard {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      transition: transform 0.65s cubic-bezier(.22,.8,.25,1);
      z-index: 2;
    }

    .fixed-index {
      position: absolute;
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 23px solid var(--mark);
      z-index: 12;
      filter: drop-shadow(0 1px 1px #000);
    }

    .aircraft {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.9));
    }

    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #dcdcdc;
      border: 2px solid #111;
      z-index: 11;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      margin: 0 auto;
      max-width: 390px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      text-align: left;
      font-weight: 700;
    }

    input[type="number"] {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 18px;
    }

    button {
      height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 8px;
      background: #1f6feb;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1759bd;
    }

    .slider-wrap {
      max-width: 390px;
      margin: 14px auto 0;
    }

    input[type="range"] {
      width: 100%;
    }

    .readout {
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
    }

    .hint {
      margin-top: 8px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Girodireccional</h1>

    <div class="instrument" aria-label="Indicador de rumbo">
      <svg id="compassCard" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="178" fill="#202020"/>

        <g id="marks"></g>
        <g id="labels"></g>

        <circle cx="200" cy="200" r="177"
                fill="none" stroke="#eeeeee" stroke-width="2"/>
      </svg>

      <div class="fixed-index"></div>

      <svg class="aircraft" viewBox="0 0 400 400" aria-hidden="true">
        <!-- Silueta fija del avión -->
        <path d="
          M200 92
          L190 132
          L184 181
          L116 220
          L116 239
          L181 218
          L181 275
          L162 291
          L162 306
          L200 292
          L238 306
          L238 291
          L219 275
          L219 218
          L284 239
          L284 220
          L216 181
          L210 132
          Z"
          fill="#252525"
          stroke="#eeeeee"
          stroke-width="4"
          stroke-linejoin="round"/>
        <line x1="200" y1="83" x2="200" y2="112"
              stroke="#eeeeee" stroke-width="4"/>
      </svg>

      <div class="hub"></div>
    </div>

    <div class="controls">
      <div>
        <label for="heading">Rumbo [°]</label>
        <input id="heading" type="number"
               min="0" max="359" step="1" value="0">
      </div>
      <button id="apply" type="button">Aplicar</button>
    </div>

    <div class="slider-wrap">
      <input id="headingSlider" type="range"
             min="0" max="359" step="1" value="0">
    </div>

    <div class="readout">
      Rumbo indicado: <span id="headingText">000°</span>
    </div>

    <div class="hint">
      La rosa de rumbos gira; el avión y el índice superior permanecen fijos.
    </div>
  </main>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";

    const marksGroup = document.getElementById("marks");
    const labelsGroup = document.getElementById("labels");
    const compassCard = document.getElementById("compassCard");

    const headingInput = document.getElementById("heading");
    const headingSlider = document.getElementById("headingSlider");
    const headingText = document.getElementById("headingText");
    const applyButton = document.getElementById("apply");

    let displayedHeading = 0;
    let accumulatedRotation = 0;

    function polar(cx, cy, radius, angleDeg) {
      const angle = (angleDeg - 90) * Math.PI / 180;
      return {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      };
    }

    function createCompassRose() {
      for (let heading = 0; heading < 360; heading += 5) {
        const major = heading % 30 === 0;
        const medium = heading % 10 === 0;

        const outer = polar(200, 200, 166, heading);
        const innerRadius = major ? 139 : (medium ? 147 : 154);
        const inner = polar(200, 200, innerRadius, heading);

        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", inner.x);
        line.setAttribute("y1", inner.y);
        line.setAttribute("x2", outer.x);
        line.setAttribute("y2", outer.y);
        line.setAttribute("stroke", "#f2f2f2");
        line.setAttribute("stroke-width", major ? "5" : (medium ? "3.5" : "2.5"));
        line.setAttribute("stroke-linecap", "round");
        marksGroup.appendChild(line);
      }

      for (let heading = 0; heading < 360; heading += 30) {
        const pos = polar(200, 200, 120, heading);
        const text = document.createElementNS(SVG_NS, "text");

        // Convención habitual: 3 = 030°, 6 = 060°, ..., 33 = 330°.
        const label = heading === 0 ? "0" : String(heading / 10);

        text.setAttribute("x", pos.x);
        text.setAttribute("y", pos.y);
        text.setAttribute("fill", "#f2f2f2");
        text.setAttribute("font-size", "25");
        text.setAttribute("font-family", "Arial, Helvetica, sans-serif");
        text.setAttribute("font-weight", "700");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute(
          "transform",
          `rotate(${heading} ${pos.x} ${pos.y})`
        );
        text.textContent = label;
        labelsGroup.appendChild(text);
      }
    }

    function normalizeHeading(value) {
      let heading = Number(value);

      if (!Number.isFinite(heading)) {
        heading = 0;
      }

      heading %= 360;
      if (heading < 0) {
        heading += 360;
      }

      return heading;
    }

    function shortestDelta(from, to) {
      return ((to - from + 540) % 360) - 180;
    }

    function setHeading(value) {
      const newHeading = normalizeHeading(value);

      // Para indicar un giro a la derecha, la rosa gira a la izquierda.
      const delta = shortestDelta(displayedHeading, newHeading);
      accumulatedRotation -= delta;
      displayedHeading = newHeading;

      compassCard.style.transform =
        `rotate(${accumulatedRotation}deg)`;

      const rounded = Math.round(newHeading) % 360;
      headingInput.value = rounded;
      headingSlider.value = rounded;
      headingText.textContent =
        String(rounded).padStart(3, "0") + "°";
    }

    applyButton.addEventListener("click", () => {
      setHeading(headingInput.value);
    });

    headingInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        setHeading(headingInput.value);
      }
    });

    headingInput.addEventListener("change", () => {
      setHeading(headingInput.value);
    });

    headingSlider.addEventListener("input", () => {
      setHeading(headingSlider.value);
    });

    createCompassRose();
    setHeading(0);
  </script>
</body>
</html>
