<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>ESP32-S3 Flight Display</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0c151e;
        color: #f4f7fa;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
      }
      .panel {
        width: min(1180px, 100%);
        background: #182838;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(20px, 4vw, 30px);
      }
      .status {
        text-align: center;
        margin-bottom: 18px;
      }
      .connected {
        color: #41d878;
      }
      .disconnected {
        color: #ff6464;
      }
      .instruments-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin: 0 auto 22px;
        align-items: start;
      }
      .instrument-section {
        min-width: 0;
        text-align: center;
        background: #0f1c28;
        border-radius: 14px;
        padding: 10px 10px 16px;
      }
      .instrument-wrap {
        width: min(500px, 100%);
        margin: 0 auto;
        aspect-ratio: 1;
      }
      #altimeter,
      #variometer,
      #horizon {
        width: 100%;
        height: 100%;
        display: block;
      }
      .instrument-readout {
        margin-top: -4px;
        color: #c5d2de;
        font-size: 18px;
      }
      .instrument-readout strong {
        color: #fff;
        font-size: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .card {
        background: #0f1c28;
        border-radius: 12px;
        padding: 16px;
        min-height: 116px;
      }
      .label {
        color: #9db0c2;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .value {
        font-size: clamp(30px, 8vw, 48px);
        font-weight: 700;
        line-height: 1;
      }
      .unit {
        color: #9db0c2;
        font-size: 16px;
        margin-left: 4px;
      }
      .qnh-card {
        grid-column: 1/-1;
        text-align: center;
      }
      .qnh-control {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-top: 12px;
      }
      .qnh-button {
        width: 64px;
        height: 54px;
        border: 0;
        border-radius: 10px;
        background: #2d88d8;
        color: white;
        font-size: 32px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
      }
      .qnh-button:active {
        transform: translateY(1px);
        background: #2476bd;
      }
      .qnh-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .qnh-value {
        min-width: 190px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        color: #9db0c2;
        font-size: 14px;
        flex-wrap: wrap;
      }

      @media (max-width: 980px) {
        .instruments-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .turn-coordinator-section {
          grid-column: 1 / -1;
          width: min(500px, 100%);
          justify-self: center;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 10px;
        }
        .panel {
          padding: 16px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .qnh-card {
          grid-column: auto;
        }
        .instruments-grid {
          grid-template-columns: 1fr;
        }
        .instrument-wrap {
          width: min(500px, 96vw);
        }

        .turn-coordinator-section {
          grid-column: auto;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>ESP32-S3 · Telemetría dummy</h1>
      <div class="status">
        <span id="connection" class="disconnected">WebSocket desconectado</span>
      </div>

      <section class="instruments-grid" aria-label="Instrumentos de vuelo">
        <article class="instrument-section" aria-label="Altímetro analógico">
          <div class="instrument-wrap">
            <canvas id="altimeter" width="700" height="700"></canvas>
          </div>
          <div class="instrument-readout">
            Altitud indicada: <strong id="altitudeFeet">0</strong> ft
          </div>
        </article>

        <article class="instrument-section" aria-label="Variómetro analógico">
          <div class="instrument-wrap">
            <canvas id="variometer" width="700" height="700"></canvas>
          </div>
          <div class="instrument-readout">
            Velocidad vertical: <strong id="verticalSpeedFpm">0</strong> ft/min
          </div>
        </article>

        <article class="instrument-section" aria-label="Horizonte artificial">
          <div class="instrument-wrap">
            <canvas
              id="horizon"
              width="1000"
              height="1000"
              aria-label="Horizonte artificial controlado por pitch y roll"
            ></canvas>
          </div>
          <div class="instrument-readout">
            Pitch: <strong id="horizonPitchDeg">0.00</strong>° ·
            Roll: <strong id="horizonRollDeg">0.00</strong>°
          </div>
        </article>

        <article
          class="instrument-section turn-coordinator-section"
          aria-label="Coordinador de viraje y bola"
        >
          <div class="instrument-wrap">
<svg
             id="turnCoordinator"
            viewBox="0 0 800 800"
            role="img"
            aria-label="Coordinador de viraje interactivo"
          >
            <defs>
              <radialGradient id="bezelGradient" cx="45%" cy="34%">
                <stop offset="0%" stop-color="#777" />
                <stop offset="42%" stop-color="#414141" />
                <stop offset="76%" stop-color="#202020" />
                <stop offset="100%" stop-color="#090909" />
              </radialGradient>

              <radialGradient id="faceGradient" cx="50%" cy="40%">
                <stop offset="0%" stop-color="#30343a" />
                <stop offset="62%" stop-color="#1c2127" />
                <stop offset="100%" stop-color="#11151a" />
              </radialGradient>

              <linearGradient id="tubeGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#efedbd" />
                <stop offset="30%" stop-color="#cacc9f" />
                <stop offset="58%" stop-color="#85886d" />
                <stop offset="100%" stop-color="#d7d6aa" />
              </linearGradient>

              <radialGradient id="ballGradient" cx="34%" cy="26%">
                <stop offset="0%" stop-color="#c9c9c9" />
                <stop offset="18%" stop-color="#555" />
                <stop offset="58%" stop-color="#111" />
                <stop offset="100%" stop-color="#010101" />
              </radialGradient>

              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow
                  dx="0"
                  dy="7"
                  stdDeviation="6"
                  flood-color="#000"
                  flood-opacity=".62"
                />
              </filter>

              <!-- El clip coincide con la cavidad interior del tubo -->
              <clipPath id="tubeClip">
                <path
                  d="
              M 250 548
              Q 400 580 550 548
              L 538 603
              Q 400 630 262 603
              Z"
                />
              </clipPath>
            </defs>

            <!-- Marco -->
            <circle cx="400" cy="400" r="386" fill="#080808" />
            <circle
              cx="400"
              cy="400"
              r="375"
              fill="url(#bezelGradient)"
              stroke="#b9b9b9"
              stroke-width="8"
            />
            <circle
              cx="400"
              cy="400"
              r="339"
              fill="url(#faceGradient)"
              stroke="#262b31"
              stroke-width="20"
            />

            <!-- Únicamente las marcas de 0° y las inferiores -->
            <g fill="#fff">
              <rect x="127" y="391" width="49" height="19" rx="4" />
              <rect x="624" y="391" width="49" height="19" rx="4" />

              <rect
                x="155"
                y="493"
                width="48"
                height="18"
                rx="3"
                transform="rotate(-18 179 502)"
              />
              <rect
                x="597"
                y="493"
                width="48"
                height="18"
                rx="3"
                transform="rotate(18 621 502)"
              />
            </g>

            <!-- Avión más esbelto -->
            <g
              id="aircraft"
              transform="rotate(0 400 400)"
              filter="url(#shadow)"
            >
              <path
                d="
            M 170 394
            L 350 387
            L 374 379
            L 385 328
            Q 388 318 400 318
            Q 412 318 415 328
            L 426 379
            L 450 387
            L 630 394
            Q 638 394 638 401
            Q 638 408 630 409
            L 449 416
            L 425 423
            L 414 435
            Q 408 441 400 441
            Q 392 441 386 435
            L 375 423
            L 351 416
            L 170 409
            Q 162 408 162 401
            Q 162 394 170 394
            Z"
                fill="#fafafa"
              />

              <path
                d="M 354 395 L 446 395"
                stroke="#d8d8d8"
                stroke-width="3"
                opacity=".52"
              />
            </g>

            <text
              x="400"
              y="536"
              fill="#f6f6f6"
              text-anchor="middle"
              font-size="26"
              font-family="Arial"
            >
              TURN COORDINATOR
            </text>

            <!-- Contenedor de la bola -->
            <path
              d="
          M 250 548
          Q 400 580 550 548
          L 538 603
          Q 400 630 262 603
          Z"
              fill="url(#tubeGradient)"
              stroke="#d2d2aa"
              stroke-width="3"
            />

            <path
              d="
          M 250 548
          Q 282 555 306 560
          L 313 613
          Q 282 609 262 603 Z"
              fill="#74775f"
              opacity=".42"
            />

            <path
              d="
          M 550 548
          Q 518 555 494 560
          L 487 613
          Q 518 609 538 603 Z"
              fill="#74775f"
              opacity=".42"
            />

            <!-- Marcas de centrado -->
            <g stroke="#22262a" stroke-width="7">
              <path d="M 365 568 Q 362 591 365 619" />
              <path d="M 435 568 Q 438 591 435 619" />
            </g>

            <!-- Bola: centro calculado sobre una curva y siempre dentro del clip -->
            <g id="ball" clip-path="url(#tubeClip)">
              <circle cx="400" cy="589" r="24" fill="url(#ballGradient)" />
              <ellipse
                cx="391"
                cy="580"
                rx="7"
                ry="5"
                fill="#fff"
                opacity=".16"
              />
            </g>

            <text
              x="225"
              y="620"
              fill="#fff"
              text-anchor="middle"
              font-size="45"
              font-family="Arial"
            >
              L
            </text>

            <text
              x="575"
              y="620"
              fill="#fff"
              text-anchor="middle"
              font-size="45"
              font-family="Arial"
            >
              R
            </text>

            <text
              x="400"
              y="656"
              fill="#fff"
              text-anchor="middle"
              font-size="30"
              font-family="Arial"
              letter-spacing="3"
            >
              2 MIN.
            </text>

            <text
              x="400"
              y="704"
              fill="#fff"
              text-anchor="middle"
              font-size="23"
              font-family="Arial"
            >
              <tspan x="400" dy="0">NO PITCH</tspan>
              <tspan x="400" dy="27">INFORMATION</tspan>
            </text>
          </svg>
          </div>
          <div class="instrument-readout">
            Giro: <strong id="turnRateDps">0.00</strong> °/s ·
            Fuerza: <strong id="forceDirectionDeg">0.0</strong>°
          </div>
        </article>
      </section>

      <section class="grid">
        <article class="card">
          <div class="label">Roll</div>
          <span id="roll" class="value">0.00</span><span class="unit">°</span>
        </article>
        <article class="card">
          <div class="label">Pitch</div>
          <span id="pitch" class="value">0.00</span><span class="unit">°</span>
        </article>
        <article class="card">
          <div class="label">Yaw</div>
          <span id="yaw" class="value">0.00</span><span class="unit">°</span>
        </article>
        <article class="card">
          <div class="label">Altitud</div>
          <span id="altitude" class="value">0.00</span
          ><span class="unit">m</span>
        </article>
        <article class="card">
          <div class="label">Velocidad vertical</div>
          <span id="verticalSpeed" class="value">0.00</span
          ><span class="unit">m/s</span>
        </article>
        <article class="card">
          <div class="label">Contador</div>
          <span id="counter" class="value">0</span>
        </article>
        <article class="card qnh-card">
          <div class="label">QNH</div>
          <div class="qnh-control">
            <button
              id="qnhDown"
              class="qnh-button"
              type="button"
              aria-label="Reducir QNH"
            >
              −
            </button>
            <div class="qnh-value">
              <span id="qnh" class="value">1013.25</span
              ><span class="unit">hPa</span>
            </div>
            <button
              id="qnhUp"
              class="qnh-button"
              type="button"
              aria-label="Aumentar QNH"
            >
              +
            </button>
          </div>
        </article>
      </section>
      <div class="footer">
        <span id="messageRate">0 mensajes/s</span
        ><span id="time">t = 0.000 s</span>
      </div>
    </main>
    <script>
      "use strict";

      const connectionElement = document.getElementById("connection");
      const qnhUpButton = document.getElementById("qnhUp");
      const qnhDownButton = document.getElementById("qnhDown");
      const canvas = document.getElementById("altimeter");
      const ctx = canvas.getContext("2d");
      const variometerCanvas = document.getElementById("variometer");
      const variometerCtx = variometerCanvas.getContext("2d");
      const horizonCanvas = document.getElementById("horizon");
      const horizonCtx = horizonCanvas.getContext("2d");
      const horizonPitchDegElement = document.getElementById("horizonPitchDeg");
      const horizonRollDegElement = document.getElementById("horizonRollDeg");
      const altitudeFeetElement = document.getElementById("altitudeFeet");
      const verticalSpeedFpmElement =
        document.getElementById("verticalSpeedFpm");
      const turnRateDpsElement = document.getElementById("turnRateDps");
      const forceDirectionDegElement =
        document.getElementById("forceDirectionDeg");
      const turnAircraft = document.getElementById("aircraft");
      const slipBall = document.getElementById("ball");

      let socket = null;
      let received = 0;
      let displayedAltitudeFeet = 0;
      let targetAltitudeFeet = 0;
      let displayedVerticalSpeedFpm = 0;
      let targetVerticalSpeedFpm = 0;
      let displayedTurnRateDps = 0;
      let targetTurnRateDps = 0;
      let displayedForceDirectionDeg = 0;
      let targetForceDirectionDeg = 0;
      let displayedHorizonPitch = 0;
      let targetHorizonPitch = 0;
      let displayedHorizonRoll = 0;
      let targetHorizonRoll = 0;
      let lastFrameTime = performance.now();

      const angleForScale = (value) => (value / 10) * Math.PI * 2 - Math.PI / 2;
      const pointOnCircle = (cx, cy, radius, angle) => ({
        x: cx + Math.cos(angle) * radius,
        y: cy + Math.sin(angle) * radius,
      });

      function setConnectionState(connected) {
        connectionElement.textContent = connected
          ? "WebSocket conectado"
          : "WebSocket desconectado";
        connectionElement.className = connected ? "connected" : "disconnected";
        qnhUpButton.disabled = !connected;
        qnhDownButton.disabled = !connected;
      }

      function drawNeedle(cx, cy, angle, length, width, longNeedle) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        const tail = longNeedle ? 26 : 18;
        const tipWidth = width * 0.58;
        ctx.beginPath();
        ctx.moveTo(-tail, -width * 0.45);
        ctx.lineTo(length - 18, -width / 2);
        ctx.lineTo(length, -tipWidth / 2);
        ctx.lineTo(length, tipWidth / 2);
        ctx.lineTo(length - 18, width / 2);
        ctx.lineTo(-tail, width * 0.45);
        ctx.closePath();
        const gradient = ctx.createLinearGradient(-tail, 0, length, 0);
        gradient.addColorStop(0, "#b9bec4");
        gradient.addColorStop(0.45, "#fff");
        gradient.addColorStop(1, "#d5d9dd");
        ctx.fillStyle = gradient;
        ctx.shadowColor = "rgba(0,0,0,.8)";
        ctx.shadowBlur = 7;
        ctx.shadowOffsetY = 4;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#1b1e21";
        ctx.stroke();
        ctx.restore();
      }

      function drawAltimeter(altitudeFeet) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const outerRadius = Math.min(w, h) * 0.46;
        const dialRadius = outerRadius * 0.87;

        ctx.clearRect(0, 0, w, h);

        const bezel = ctx.createRadialGradient(
          cx - outerRadius * 0.25,
          cy - outerRadius * 0.28,
          outerRadius * 0.2,
          cx,
          cy,
          outerRadius,
        );
        bezel.addColorStop(0, "#41474d");
        bezel.addColorStop(0.5, "#15191d");
        bezel.addColorStop(1, "#040607");
        ctx.beginPath();
        ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
        ctx.fillStyle = bezel;
        ctx.shadowColor = "rgba(0,0,0,.7)";
        ctx.shadowBlur = 25;
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx, cy, outerRadius * 0.94, 0, Math.PI * 2);
        ctx.fillStyle = "#050708";
        ctx.fill();

        const face = ctx.createRadialGradient(
          cx - 80,
          cy - 90,
          10,
          cx,
          cy,
          dialRadius,
        );
        face.addColorStop(0, "#282b2e");
        face.addColorStop(1, "#101214");
        ctx.beginPath();
        ctx.arc(cx, cy, dialRadius, 0, Math.PI * 2);
        ctx.fillStyle = face;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#4d5358";
        ctx.stroke();

        for (let i = 0; i < 100; i++) {
          const angle = (i / 100) * Math.PI * 2 - Math.PI / 2;
          const major = i % 10 === 0;
          const medium = i % 5 === 0;
          const outer = dialRadius * 0.95;
          const inner = major
            ? dialRadius * 0.83
            : medium
              ? dialRadius * 0.865
              : dialRadius * 0.89;
          const p1 = pointOnCircle(cx, cy, inner, angle);
          const p2 = pointOnCircle(cx, cy, outer, angle);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = "#f5f5f5";
          ctx.lineWidth = major ? 7 : medium ? 4 : 2.3;
          ctx.stroke();
        }

        ctx.fillStyle = "#f3f3f3";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "58px Arial";
        for (let n = 0; n <= 9; n++) {
          const p = pointOnCircle(cx, cy, dialRadius * 0.7, angleForScale(n));
          ctx.fillText(String(n), p.x, p.y);
        }

        ctx.font = "48px Arial";
        ctx.fillText("ALT", cx, cy - 72);

        ctx.font = "26px Arial";
        ctx.fillStyle = "#f3f3f3";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText("x 1000 ft", cx, cy + dialRadius * 0.3);

        const triangleY = cy - dialRadius * 0.92;
        ctx.beginPath();
        ctx.moveTo(cx, triangleY + 34);
        ctx.lineTo(cx - 24, triangleY);
        ctx.lineTo(cx + 24, triangleY);
        ctx.closePath();
        ctx.fillStyle = "#f5f5f5";
        ctx.fill();

        const hundreds = (altitudeFeet % 1000) / 100;
        const thousands = (altitudeFeet % 10000) / 1000;

        drawNeedle(
          cx,
          cy,
          angleForScale(thousands),
          dialRadius * 0.55,
          23,
          false,
        );
        drawNeedle(
          cx,
          cy,
          angleForScale(hundreds),
          dialRadius * 0.82,
          23,
          true,
        );

        ctx.beginPath();
        ctx.arc(cx, cy, 27, 0, Math.PI * 2);
        const hub = ctx.createRadialGradient(cx - 8, cy - 8, 3, cx, cy, 27);
        hub.addColorStop(0, "#70767c");
        hub.addColorStop(0.45, "#2b2f33");
        hub.addColorStop(1, "#090b0d");
        ctx.fillStyle = hub;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#070809";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#0c0e10";
        ctx.fill();
      }

      function variometerAngle(verticalSpeedFpm) {
        const limited = Math.max(-2000, Math.min(2000, verticalSpeedFpm));
        return Math.PI + (limited / 2000) * Math.PI;
      }

      function drawVariometerNeedle(cx, cy, angle, length, width) {
        const vctx = variometerCtx;
        vctx.save();
        vctx.translate(cx, cy);
        vctx.rotate(angle);

        vctx.beginPath();
        vctx.moveTo(-34, -width * 0.42);
        vctx.lineTo(length - 18, -width / 2);
        vctx.lineTo(length, 0);
        vctx.lineTo(length - 18, width / 2);
        vctx.lineTo(-34, width * 0.42);
        vctx.closePath();

        const gradient = vctx.createLinearGradient(-34, 0, length, 0);
        gradient.addColorStop(0, "#b9bec4");
        gradient.addColorStop(0.45, "#ffffff");
        gradient.addColorStop(1, "#d5d9dd");
        vctx.fillStyle = gradient;
        vctx.shadowColor = "rgba(0,0,0,.8)";
        vctx.shadowBlur = 7;
        vctx.shadowOffsetY = 4;
        vctx.fill();
        vctx.lineWidth = 2;
        vctx.strokeStyle = "#1b1e21";
        vctx.stroke();
        vctx.restore();
      }

      function drawVariometer(verticalSpeedFpm) {
        const vctx = variometerCtx;
        const w = variometerCanvas.width;
        const h = variometerCanvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const outerRadius = Math.min(w, h) * 0.46;
        const dialRadius = outerRadius * 0.87;

        vctx.clearRect(0, 0, w, h);

        const bezel = vctx.createRadialGradient(
          cx - outerRadius * 0.25,
          cy - outerRadius * 0.28,
          outerRadius * 0.2,
          cx,
          cy,
          outerRadius,
        );
        bezel.addColorStop(0, "#41474d");
        bezel.addColorStop(0.5, "#15191d");
        bezel.addColorStop(1, "#040607");
        vctx.beginPath();
        vctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
        vctx.fillStyle = bezel;
        vctx.shadowColor = "rgba(0,0,0,.7)";
        vctx.shadowBlur = 25;
        vctx.fill();

        vctx.shadowBlur = 0;
        vctx.beginPath();
        vctx.arc(cx, cy, outerRadius * 0.94, 0, Math.PI * 2);
        vctx.fillStyle = "#050708";
        vctx.fill();

        const face = vctx.createRadialGradient(
          cx - 80,
          cy - 90,
          10,
          cx,
          cy,
          dialRadius,
        );
        face.addColorStop(0, "#282b2e");
        face.addColorStop(1, "#101214");
        vctx.beginPath();
        vctx.arc(cx, cy, dialRadius, 0, Math.PI * 2);
        vctx.fillStyle = face;
        vctx.fill();
        vctx.lineWidth = 3;
        vctx.strokeStyle = "#4d5358";
        vctx.stroke();

        /* 80 divisiones: 0..+20 por arriba y 0..-20 por abajo. */
        for (let i = 0; i < 80; i++) {
          const angle = Math.PI + (i / 80) * Math.PI * 2;
          const major = i % 10 === 0;
          const medium = i % 5 === 0;
          const outer = dialRadius * 0.95;
          const inner = major
            ? dialRadius * 0.82
            : medium
              ? dialRadius * 0.86
              : dialRadius * 0.89;
          const p1 = pointOnCircle(cx, cy, inner, angle);
          const p2 = pointOnCircle(cx, cy, outer, angle);
          vctx.beginPath();
          vctx.moveTo(p1.x, p1.y);
          vctx.lineTo(p2.x, p2.y);
          vctx.strokeStyle = "#f5f5f5";
          vctx.lineWidth = major ? 7 : medium ? 4 : 2.3;
          vctx.stroke();
        }

        vctx.fillStyle = "#f3f3f3";
        vctx.textAlign = "center";
        vctx.textBaseline = "middle";
        vctx.font = "48px Arial";

        const labels = [
          { value: 0, text: "0" },
          { value: 500, text: "5" },
          { value: 1000, text: "10" },
          { value: 1500, text: "15" },
          { value: 2000, text: "20" },
          { value: -500, text: "5" },
          { value: -1000, text: "10" },
          { value: -1500, text: "15" },
        ];

        for (const label of labels) {
          const p = pointOnCircle(
            cx,
            cy,
            dialRadius * 0.69,
            variometerAngle(label.value),
          );
          vctx.fillText(label.text, p.x, p.y);
        }

        vctx.font = "34px Arial";
        vctx.fillText("VERTICAL", cx, cy - 82);
        vctx.fillText("SPEED", cx, cy - 43);
        vctx.font = "22px Arial";
        vctx.fillText("x 100 ft/min", cx, cy + dialRadius * 0.35);

        vctx.font = "22px Arial";
        vctx.textAlign = "left";
        vctx.fillText("UP", cx - dialRadius * 0.49, cy - 56);
        vctx.fillText("DOWN", cx - dialRadius * 0.49, cy + 58);

        vctx.strokeStyle = "#f3f3f3";
        vctx.fillStyle = "#f3f3f3";
        vctx.lineWidth = 4;
        const arrowX = cx - dialRadius * 0.58;
        vctx.beginPath();
        vctx.moveTo(arrowX, cy - 18);
        vctx.lineTo(arrowX, cy - 70);
        vctx.stroke();
        vctx.beginPath();
        vctx.moveTo(arrowX, cy - 78);
        vctx.lineTo(arrowX - 9, cy - 59);
        vctx.lineTo(arrowX + 9, cy - 59);
        vctx.closePath();
        vctx.fill();

        vctx.beginPath();
        vctx.moveTo(arrowX, cy + 18);
        vctx.lineTo(arrowX, cy + 70);
        vctx.stroke();
        vctx.beginPath();
        vctx.moveTo(arrowX, cy + 78);
        vctx.lineTo(arrowX - 9, cy + 59);
        vctx.lineTo(arrowX + 9, cy + 59);
        vctx.closePath();
        vctx.fill();

        drawVariometerNeedle(
          cx,
          cy,
          variometerAngle(verticalSpeedFpm),
          dialRadius * 0.78,
          18,
        );

        vctx.beginPath();
        vctx.arc(cx, cy, 27, 0, Math.PI * 2);
        const hub = vctx.createRadialGradient(cx - 8, cy - 8, 3, cx, cy, 27);
        hub.addColorStop(0, "#70767c");
        hub.addColorStop(0.45, "#2b2f33");
        hub.addColorStop(1, "#090b0d");
        vctx.fillStyle = hub;
        vctx.fill();
        vctx.lineWidth = 4;
        vctx.strokeStyle = "#070809";
        vctx.stroke();
        vctx.beginPath();
        vctx.arc(cx, cy, 7, 0, Math.PI * 2);
        vctx.fillStyle = "#0c0e10";
        vctx.fill();
      }

      function turnAircraftAngle(rateDps) {
        /* ±3 °/s corresponde aproximadamente a ±25° visuales. */
        return Math.max(-50, Math.min(50, (rateDps / 3) * 25));
      }

      function slipBallPosition(forceDirectionDeg) {
        const normalized = Math.max(
          -1,
          Math.min(1, forceDirectionDeg / 25),
        );

        return {
          x: normalized * 112,
          y: -10 * normalized * normalized,
        };
      }

      function updateTurnCoordinator(turnRateDps, forceDirectionDeg) {
        const aircraftAngle = turnAircraftAngle(turnRateDps);
        const ballPosition = slipBallPosition(forceDirectionDeg);

        turnAircraft.setAttribute(
          "transform",
          `rotate(${aircraftAngle.toFixed(2)} 400 400)`,
        );

        slipBall.setAttribute(
          "transform",
          `translate(${ballPosition.x.toFixed(2)} ${ballPosition.y.toFixed(2)})`,
        );

        turnRateDpsElement.textContent = turnRateDps.toFixed(2);
        forceDirectionDegElement.textContent = forceDirectionDeg.toFixed(1);
      }

      const hW = horizonCanvas.width;
      const hH = horizonCanvas.height;
      const hCx = hW / 2;
      const hCy = hH / 2;

      const screenRadius = 365;
      const bezelOuter = 465;
      const bezelInner = 407;
      const pixelsPerDegree = 8.2;
      function horizonDegToRad(deg) {
      return deg * Math.PI / 180;
      }

      function formatAngle(value) {
      const n = Math.round(value);
      return `${n > 0 ? "+" : ""}${n}°`;
      }

      function shortestAngleDifference(target, current) {
      return ((target - current + 540) % 360) - 180;
      }

      function drawHorizonBezel() {
      horizonCtx.save();

      const g = horizonCtx.createRadialGradient(
      hCx - 90, hCy - 130, 70,
      hCx, hCy, bezelOuter
      );
      g.addColorStop(0, "#3b3f46");
      g.addColorStop(.46, "#1c1f24");
      g.addColorStop(1, "#07080a");

      horizonCtx.beginPath();
      horizonCtx.arc(hCx, hCy, bezelOuter, 0, Math.PI * 2);
      horizonCtx.fillStyle = g;
      horizonCtx.fill();

      horizonCtx.lineWidth = 8;
      horizonCtx.strokeStyle = "#4c5057";
      horizonCtx.stroke();

      horizonCtx.beginPath();
      horizonCtx.arc(hCx, hCy, bezelInner, 0, Math.PI * 2);
      horizonCtx.fillStyle = "#050608";
      horizonCtx.fill();

      horizonCtx.lineWidth = 10;
      horizonCtx.strokeStyle = "#101318";
      horizonCtx.stroke();

      horizonCtx.restore();
      }

      function drawHorizonPitchLadder() {
      horizonCtx.save();

      horizonCtx.strokeStyle = "#fff";
      horizonCtx.fillStyle = "#fff";
      horizonCtx.lineWidth = 7;
      horizonCtx.lineCap = "round";
      horizonCtx.textAlign = "center";
      horizonCtx.textBaseline = "middle";
      horizonCtx.font = "bold 34px Arial";

      for (let angle = -80; angle <= 80; angle += 5) {
      if (angle === 0) continue;

      const y = -angle * pixelsPerDegree;
      const absAngle = Math.abs(angle);
      const major = absAngle % 10 === 0;
      const halfWidth = major ? 92 : 38;

      horizonCtx.beginPath();
      horizonCtx.moveTo(-halfWidth, y);
      horizonCtx.lineTo(halfWidth, y);
      horizonCtx.stroke();

      if (major && absAngle <= 50) {
      horizonCtx.fillText(String(absAngle), -132, y);
      horizonCtx.fillText(String(absAngle), 132, y);
      }
      }

      horizonCtx.restore();
      }

      function drawHorizonGroundPerspective() {
      horizonCtx.save();

      horizonCtx.strokeStyle = "rgba(255,255,255,.92)";
      horizonCtx.lineWidth = 4;
      horizonCtx.lineCap = "round";

      /*
      * Las líneas parten del centro del horizonte y se abren
      * hasta la circunferencia inferior del instrumento.
      */
      const endAngles = [28, 47, 66, 114, 133, 152];

      for (const a of endAngles) {
      const rad = horizonDegToRad(a);
      const x = Math.cos(rad) * screenRadius;
      const y = Math.sin(rad) * screenRadius;

      horizonCtx.beginPath();
      horizonCtx.moveTo(0, 0);
      horizonCtx.lineTo(x, y);
      horizonCtx.stroke();
      }

      horizonCtx.restore();
      }

      function drawHorizonMovingSphere(pitch, roll) {
      horizonCtx.save();

      horizonCtx.beginPath();
      horizonCtx.arc(hCx, hCy, screenRadius, 0, Math.PI * 2);
      horizonCtx.clip();

      horizonCtx.translate(hCx, hCy);
      horizonCtx.rotate(horizonDegToRad(-roll));
      horizonCtx.translate(0, pitch * pixelsPerDegree);

      const ext = 1900;

      const sky = horizonCtx.createLinearGradient(0, -950, 0, 0);
      sky.addColorStop(0, "#0062ad");
      sky.addColorStop(.55, "#218fd3");
      sky.addColorStop(1, "#66c6ef");
      horizonCtx.fillStyle = sky;
      horizonCtx.fillRect(-ext, -ext, ext * 2, ext);

      const earth = horizonCtx.createLinearGradient(0, 0, 0, 1000);
      earth.addColorStop(0, "#875635");
      earth.addColorStop(1, "#2c190f");
      horizonCtx.fillStyle = earth;
      horizonCtx.fillRect(-ext, 0, ext * 2, ext);

      // Horizonte
      horizonCtx.fillStyle = "#fff";
      horizonCtx.fillRect(-ext, -7, ext * 2, 14);

      // Perspectiva en la zona marrón
      drawHorizonGroundPerspective();

      // Escala de pitch
      drawHorizonPitchLadder();

      horizonCtx.restore();

      // Reflejo del cristal
      horizonCtx.save();
      horizonCtx.beginPath();
      horizonCtx.arc(hCx, hCy, screenRadius, 0, Math.PI * 2);
      horizonCtx.clip();

      const glass = horizonCtx.createRadialGradient(
      hCx - 95, hCy - 125, 20,
      hCx, hCy, screenRadius
      );
      glass.addColorStop(0, "rgba(255,255,255,.12)");
      glass.addColorStop(.58, "rgba(255,255,255,.025)");
      glass.addColorStop(1, "rgba(0,0,0,.18)");

      horizonCtx.fillStyle = glass;
      horizonCtx.fillRect(
      hCx - screenRadius,
      hCy - screenRadius,
      screenRadius * 2,
      screenRadius * 2
      );

      horizonCtx.restore();
      }

      function drawHorizonBankScale() {
      horizonCtx.save();

      // Índice superior amarillo
      horizonCtx.fillStyle = "#ffe400";
      horizonCtx.beginPath();
      horizonCtx.moveTo(hCx, hCy - screenRadius + 13);
      horizonCtx.lineTo(hCx - 18, hCy - screenRadius + 55);
      horizonCtx.lineTo(hCx + 18, hCy - screenRadius + 55);
      horizonCtx.closePath();
      horizonCtx.fill();

      // Marcas blancas, sin puntos ni números
      const marks = [
      { angle: -90, length: 53, width: 9 },
      { angle: -60, length: 45, width: 8 },
      { angle: -45, length: 38, width: 8 },
      { angle: -30, length: 50, width: 9 },
      { angle: -20, length: 42, width: 8 },
      { angle: -10, length: 42, width: 8 },
      { angle:  10, length: 42, width: 8 },
      { angle:  20, length: 42, width: 8 },
      { angle:  30, length: 50, width: 9 },
      { angle:  45, length: 38, width: 8 },
      { angle:  60, length: 45, width: 8 },
      { angle:  90, length: 53, width: 9 }
      ];

      horizonCtx.strokeStyle = "#fff";
      horizonCtx.lineCap = "butt";

      for (const mark of marks) {
      const a = horizonDegToRad(mark.angle - 90);
      const r1 = screenRadius - 3;
      const r2 = r1 - mark.length;

      horizonCtx.lineWidth = mark.width;
      horizonCtx.beginPath();
      horizonCtx.moveTo(
      hCx + Math.cos(a) * r1,
      hCy + Math.sin(a) * r1
      );
      horizonCtx.lineTo(
      hCx + Math.cos(a) * r2,
      hCy + Math.sin(a) * r2
      );
      horizonCtx.stroke();
      }

      horizonCtx.restore();
      }

      function drawHorizonAircraftSymbol() {
      horizonCtx.save();

      horizonCtx.strokeStyle = "#ffe500";
      horizonCtx.fillStyle = "#ffe500";
      horizonCtx.lineWidth = 16;
      horizonCtx.lineCap = "round";
      horizonCtx.lineJoin = "round";

      horizonCtx.beginPath();
      horizonCtx.moveTo(hCx - 210, hCy);
      horizonCtx.lineTo(hCx - 65, hCy);
      horizonCtx.quadraticCurveTo(hCx - 55, hCy + 45, hCx, hCy + 45);
      horizonCtx.quadraticCurveTo(hCx + 55, hCy + 45, hCx + 65, hCy);
      horizonCtx.lineTo(hCx + 210, hCy);
      horizonCtx.stroke();

      horizonCtx.beginPath();
      horizonCtx.arc(hCx, hCy, 10, 0, Math.PI * 2);
      horizonCtx.fill();

      horizonCtx.restore();
      }

      function drawHorizonLowerMask() {
      horizonCtx.save();

      const g = horizonCtx.createLinearGradient(0, hCy + 250, 0, hCy + 490);
      g.addColorStop(0, "#22262b");
      g.addColorStop(1, "#0b0d10");

      horizonCtx.beginPath();
      horizonCtx.moveTo(hCx - 315, hCy + 292);
      horizonCtx.lineTo(hCx + 315, hCy + 292);
      horizonCtx.quadraticCurveTo(hCx + 365, hCy + 300, hCx + 395, hCy + 340);
      horizonCtx.lineTo(hCx + 410, hCy + 430);
      horizonCtx.lineTo(hCx - 410, hCy + 430);
      horizonCtx.lineTo(hCx - 395, hCy + 340);
      horizonCtx.quadraticCurveTo(hCx - 365, hCy + 300, hCx - 315, hCy + 292);
      horizonCtx.closePath();

      horizonCtx.fillStyle = g;
      horizonCtx.fill();

      horizonCtx.restore();
      }

      function drawHorizonKnob() {
      const y = hCy + 395;

      const g = horizonCtx.createRadialGradient(
      hCx - 12, y - 14, 8,
      hCx, y, 55
      );
      g.addColorStop(0, "#383c42");
      g.addColorStop(1, "#111317");

      horizonCtx.beginPath();
      horizonCtx.arc(hCx, y, 55, 0, Math.PI * 2);
      horizonCtx.fillStyle = g;
      horizonCtx.fill();

      horizonCtx.lineWidth = 7;
      horizonCtx.strokeStyle = "#050607";
      horizonCtx.stroke();

      horizonCtx.beginPath();
      horizonCtx.arc(hCx, y, 39, 0, Math.PI * 2);
      horizonCtx.fillStyle = "#202328";
      horizonCtx.fill();

      horizonCtx.lineWidth = 3;
      horizonCtx.strokeStyle = "#3e434a";
      horizonCtx.stroke();
      }

      function drawHorizonFrame() {
      horizonCtx.clearRect(0, 0, hW, hH);
      drawHorizonBezel();
      drawHorizonMovingSphere(displayedHorizonPitch, displayedHorizonRoll);
      drawHorizonBankScale();
      drawHorizonAircraftSymbol();
      drawHorizonLowerMask();
      drawHorizonKnob();
      }


      function animateAltimeter(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;
        const alpha = 1 - Math.exp(-8 * dt);
        displayedAltitudeFeet +=
          (targetAltitudeFeet - displayedAltitudeFeet) * alpha;
        displayedVerticalSpeedFpm +=
          (targetVerticalSpeedFpm - displayedVerticalSpeedFpm) * alpha;
        displayedTurnRateDps +=
          (targetTurnRateDps - displayedTurnRateDps) * alpha;
        displayedForceDirectionDeg +=
          (targetForceDirectionDeg - displayedForceDirectionDeg) * alpha;
        displayedHorizonPitch +=
          (targetHorizonPitch - displayedHorizonPitch) * alpha;
        displayedHorizonRoll +=
          shortestAngleDifference(targetHorizonRoll, displayedHorizonRoll) * alpha;

        if (Math.abs(targetAltitudeFeet - displayedAltitudeFeet) < 0.02) {
          displayedAltitudeFeet = targetAltitudeFeet;
        }
        if (
          Math.abs(targetVerticalSpeedFpm - displayedVerticalSpeedFpm) < 0.02
        ) {
          displayedVerticalSpeedFpm = targetVerticalSpeedFpm;
        }

        drawAltimeter(displayedAltitudeFeet);
        drawVariometer(displayedVerticalSpeedFpm);
        updateTurnCoordinator(
          displayedTurnRateDps,
          displayedForceDirectionDeg,
        );
        drawHorizonFrame();
        horizonPitchDegElement.textContent = displayedHorizonPitch.toFixed(2);
        horizonRollDegElement.textContent = displayedHorizonRoll.toFixed(2);

        altitudeFeetElement.textContent = Math.round(
          displayedAltitudeFeet,
        ).toLocaleString("en-US");
        verticalSpeedFpmElement.textContent = Math.round(
          displayedVerticalSpeedFpm,
        ).toLocaleString("en-US");

        requestAnimationFrame(animateAltimeter);
      }

      function updateTelemetry(data) {
        document.getElementById("roll").textContent = data.roll.toFixed(2);
        document.getElementById("pitch").textContent = data.pitch.toFixed(2);
        document.getElementById("yaw").textContent = data.yaw.toFixed(2);
        document.getElementById("altitude").textContent =
          data.altitude.toFixed(2);
        document.getElementById("verticalSpeed").textContent =
          data.vertical_speed.toFixed(2);
        document.getElementById("counter").textContent = data.counter;
        document.getElementById("qnh").textContent = data.qnh.toFixed(2);
        document.getElementById("time").textContent =
          `t = ${data.time_s.toFixed(3)} s`;

        /* El horizonte utiliza directamente pitch y roll, expresados en grados. */
        targetHorizonPitch = Math.max(-90, Math.min(90, Number(data.pitch ?? 0)));
        targetHorizonRoll = Math.max(-180, Math.min(180, Number(data.roll ?? 0)));

        /* La telemetría entrega altitud en metros y velocidad vertical en m/s. */
        targetAltitudeFeet = Math.max(0, data.altitude * 3.280839895);
        targetVerticalSpeedFpm = Math.max(
          -2000,
          Math.min(2000, data.vertical_speed * 196.850394),
        );

        targetTurnRateDps = Math.max(
          -6,
          Math.min(6, Number(data.turn_rate_dps ?? 0)),
        );
        targetForceDirectionDeg = Math.max(
          -25,
          Math.min(25, Number(data.force_direction_deg ?? 0)),
        );
      }

      function sendCommand(command) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(command);
        }
      }

      function connect() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${location.host}/ws`);
        socket.onopen = () => setConnectionState(true);
        socket.onmessage = (event) => {
          try {
            updateTelemetry(JSON.parse(event.data));
            received++;
          } catch (error) {
            console.error("Mensaje WebSocket no válido:", error);
          }
        };
        socket.onerror = (error) => console.error("Error WebSocket:", error);
        socket.onclose = () => {
          setConnectionState(false);
          setTimeout(connect, 1000);
        };
      }

      qnhUpButton.addEventListener("click", () => sendCommand("QNH_UP"));
      qnhDownButton.addEventListener("click", () => sendCommand("QNH_DOWN"));
      setInterval(() => {
        document.getElementById("messageRate").textContent =
          `${received} mensajes/s`;
        received = 0;
      }, 1000);

      setConnectionState(false);
      requestAnimationFrame(animateAltimeter);
      connect();
    </script>
  </body>
</html>
