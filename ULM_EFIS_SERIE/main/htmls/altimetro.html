<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Altímetro interactivo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          circle at top,
          #142434 0%,
          #08111a 58%,
          #050b11 100%
        );
        color: #f5f7fa;
        display: flex;
        justify-content: center;
        padding: 22px;
      }
      .panel {
        width: min(720px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0 0 18px;
        font-size: clamp(24px, 5vw, 36px);
      }
      .instrument-wrap {
        width: min(560px, 94vw);
        margin: 0 auto;
        aspect-ratio: 1;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .controls {
        margin: 20px auto 0;
        width: min(560px, 100%);
        background: rgba(20, 35, 49, 0.9);
        border: 1px solid #33495d;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      }
      .input-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: end;
        flex-wrap: wrap;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 7px;
        text-align: left;
        color: #b9c8d6;
        font-size: 14px;
      }
      input {
        width: 190px;
        padding: 11px 12px;
        border-radius: 8px;
        border: 1px solid #546b80;
        background: #09131d;
        color: #fff;
        font-size: 18px;
        outline: none;
      }
      input:focus {
        border-color: #8fc8ff;
      }
      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #2d88d8;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
      .readouts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .readout {
        background: #0b1722;
        border-radius: 9px;
        padding: 12px 8px;
      }
      .name {
        color: #9fb2c3;
        font-size: 13px;
        margin-bottom: 5px;
      }
      .value {
        font-size: 24px;
        font-weight: 700;
      }
      .note {
        margin-top: 14px;
        color: #8fa2b4;
        font-size: 13px;
      }
      @media (max-width: 520px) {
        body {
          padding: 10px;
        }
        .readouts {
          grid-template-columns: 1fr;
        }
        input {
          width: min(240px, 80vw);
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="instrument-wrap">
        <canvas id="altimeter" width="700" height="700"></canvas>
      </div>
      <section class="controls">
        <div class="input-row">
          <label
            >Altitud [ft]<input
              id="altitudeInput"
              type="number"
              min="0"
              max="19999"
              step="10"
              value="3450" /></label
          ><button id="applyButton" type="button">Aplicar</button>
        </div>
        <div class="readouts">
          <div class="readout">
            <div class="name">Altitud</div>
            <div id="altitudeValue" class="value">3,450 ft</div>
          </div>
          <div class="readout">
            <div class="name">Aguja ×1000</div>
            <div id="thousandsValue" class="value">3.45</div>
          </div>
          <div class="readout">
            <div class="name">Aguja ×100</div>
            <div id="hundredsValue" class="value">4.50</div>
          </div>
        </div>
        <div class="note">Rango de demostración: 0–19 999 ft.</div>
      </section>
    </main>
    <script>
      "use strict";
      const canvas = document.getElementById("altimeter"),
        ctx = canvas.getContext("2d"),
        input = document.getElementById("altitudeInput"),
        applyButton = document.getElementById("applyButton"),
        altitudeValue = document.getElementById("altitudeValue"),
        thousandsValue = document.getElementById("thousandsValue"),
        hundredsValue = document.getElementById("hundredsValue");
      let displayedAltitude = 3450,
        targetAltitude = 3450,
        lastFrameTime = performance.now();
      const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
      const angleForScale = (v) => (v / 10) * Math.PI * 2 - Math.PI / 2;
      const pointOnCircle = (cx, cy, r, a) => ({
        x: cx + Math.cos(a) * r,
        y: cy + Math.sin(a) * r,
      });
      function drawNeedle(cx, cy, angle, length, width, longNeedle) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        const tail = longNeedle ? 26 : 18,
          tipWidth = width * 0.58;
        ctx.beginPath();
        ctx.moveTo(-tail, -width * 0.45);
        ctx.lineTo(length - 18, -width / 2);
        ctx.lineTo(length, -tipWidth / 2);
        ctx.lineTo(length, tipWidth / 2);
        ctx.lineTo(length - 18, width / 2);
        ctx.lineTo(-tail, width * 0.45);
        ctx.closePath();
        const g = ctx.createLinearGradient(-tail, 0, length, 0);
        g.addColorStop(0, "#b9bec4");
        g.addColorStop(0.45, "#fff");
        g.addColorStop(1, "#d5d9dd");
        ctx.fillStyle = g;
        ctx.shadowColor = "rgba(0,0,0,.8)";
        ctx.shadowBlur = 7;
        ctx.shadowOffsetY = 4;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#1b1e21";
        ctx.stroke();
        ctx.restore();
      }
      function drawAltimeter(altitudeFeet) {
        const w = canvas.width,
          h = canvas.height,
          cx = w / 2,
          cy = h / 2,
          outerRadius = Math.min(w, h) * 0.46,
          dialRadius = outerRadius * 0.87;
        ctx.clearRect(0, 0, w, h);
        const bezel = ctx.createRadialGradient(
          cx - outerRadius * 0.25,
          cy - outerRadius * 0.28,
          outerRadius * 0.2,
          cx,
          cy,
          outerRadius,
        );
        bezel.addColorStop(0, "#41474d");
        bezel.addColorStop(0.5, "#15191d");
        bezel.addColorStop(1, "#040607");
        ctx.beginPath();
        ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
        ctx.fillStyle = bezel;
        ctx.shadowColor = "rgba(0,0,0,.7)";
        ctx.shadowBlur = 25;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, outerRadius * 0.94, 0, Math.PI * 2);
        ctx.fillStyle = "#050708";
        ctx.fill();
        const face = ctx.createRadialGradient(
          cx - 80,
          cy - 90,
          10,
          cx,
          cy,
          dialRadius,
        );
        face.addColorStop(0, "#282b2e");
        face.addColorStop(1, "#101214");
        ctx.beginPath();
        ctx.arc(cx, cy, dialRadius, 0, Math.PI * 2);
        ctx.fillStyle = face;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#4d5358";
        ctx.stroke();
        for (let i = 0; i < 100; i++) {
          const a = (i / 100) * Math.PI * 2 - Math.PI / 2,
            major = i % 10 === 0,
            medium = i % 5 === 0,
            outer = dialRadius * 0.95,
            inner = major
              ? dialRadius * 0.83
              : medium
                ? dialRadius * 0.865
                : dialRadius * 0.89,
            p1 = pointOnCircle(cx, cy, inner, a),
            p2 = pointOnCircle(cx, cy, outer, a);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = "#f5f5f5";
          ctx.lineWidth = major ? 7 : medium ? 4 : 2.3;
          ctx.stroke();
        }
        ctx.fillStyle = "#f3f3f3";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "58px Arial";
        for (let n = 0; n <= 9; n++) {
          const p = pointOnCircle(cx, cy, dialRadius * 0.7, angleForScale(n));
          ctx.fillText(String(n), p.x, p.y);
        }
        ctx.font = "48px Arial";
        ctx.fillText("ALT", cx, cy - 72);
        ctx.font = "18px Arial";
        ctx.fillText("CALIBRATED", cx, cy - 25);
        ctx.fillText("TO", cx, cy + 2);
        ctx.fillText("20,000 FEET", cx, cy + 29);
        ctx.font = "22px Arial";
        ctx.fillText("FEET", cx + 68, cy - dialRadius * 0.64);
        const triangleY = cy - dialRadius * 0.92;
        ctx.beginPath();
        ctx.moveTo(cx, triangleY + 34);
        ctx.lineTo(cx - 24, triangleY);
        ctx.lineTo(cx + 24, triangleY);
        ctx.closePath();
        ctx.fillStyle = "#f5f5f5";
        ctx.fill();
        const hundreds = (altitudeFeet % 1000) / 100,
          thousands = (altitudeFeet % 10000) / 1000;
        drawNeedle(
          cx,
          cy,
          angleForScale(thousands),
          dialRadius * 0.55,
          23,
          false,
        );
        drawNeedle(
          cx,
          cy,
          angleForScale(hundreds),
          dialRadius * 0.82,
          23,
          true,
        );
        ctx.beginPath();
        ctx.arc(cx, cy, 27, 0, Math.PI * 2);
        const hub = ctx.createRadialGradient(cx - 8, cy - 8, 3, cx, cy, 27);
        hub.addColorStop(0, "#70767c");
        hub.addColorStop(0.45, "#2b2f33");
        hub.addColorStop(1, "#090b0d");
        ctx.fillStyle = hub;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#070809";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#0c0e10";
        ctx.fill();
      }
      function updateReadouts(a) {
        const r = Math.round(a);
        altitudeValue.textContent = `${r.toLocaleString("en-US")} ft`;
        thousandsValue.textContent = ((a % 10000) / 1000).toFixed(2);
        hundredsValue.textContent = ((a % 1000) / 100).toFixed(2);
      }
      function setTargetFromInput() {
        const p = Number(input.value);
        if (!Number.isFinite(p)) return;
        targetAltitude = clamp(p, 0, 19999);
        input.value = Math.round(targetAltitude);
      }
      function animate(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;
        const alpha = 1 - Math.exp(-8 * dt);
        displayedAltitude += (targetAltitude - displayedAltitude) * alpha;
        if (Math.abs(targetAltitude - displayedAltitude) < 0.02)
          displayedAltitude = targetAltitude;
        drawAltimeter(displayedAltitude);
        updateReadouts(displayedAltitude);
        requestAnimationFrame(animate);
      }
      applyButton.addEventListener("click", setTargetFromInput);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") setTargetFromInput();
      });
      input.addEventListener("input", () => {
        const v = Number(input.value);
        if (Number.isFinite(v)) targetAltitude = clamp(v, 0, 19999);
      });
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
