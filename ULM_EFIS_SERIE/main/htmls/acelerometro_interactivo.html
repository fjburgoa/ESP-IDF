<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acelerómetro G interactivo</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #15171a;
      --panel: #202328;
      --housing: #77797b;
      --housing-edge: #a5a6a8;
      --dial: #45474a;
      --dial-edge: #b8b8b8;
      --mark: #f4f4f4;
      --needle: #f8f8f8;
      --accent: #dadada;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, #2b2e33 0%, var(--page) 55%, #0e0f11 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(94vw, 560px);
      padding: 22px;
      border-radius: 20px;
      background: rgba(32, 35, 40, 0.92);
      box-shadow: 0 18px 55px rgba(0,0,0,.42);
      text-align: center;
    }

    .instrument-wrap {
      width: min(86vw, 440px);
      aspect-ratio: 1;
      margin: 0 auto;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 14px rgba(0,0,0,.45));
    }

    .controls {
      margin-top: 20px;
      padding: 18px 18px 14px;
      border-radius: 14px;
      background: #17191d;
      border: 1px solid #33373d;
    }

    .readout {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }

    #valueText {
      min-width: 86px;
      font-size: 36px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .unit {
      font-size: 18px;
      color: #c9c9c9;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #e8e8e8;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: #aeb2b8;
      font-size: 13px;
    }

    .needle {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      transition: transform 80ms linear;
    }

    .tick, .label, .minor-tick { pointer-events: none; }
  </style>
</head>
<body>
  <main class="app">
    <div class="instrument-wrap">
      <svg id="gauge" viewBox="0 0 500 500" role="img" aria-label="Acelerómetro entre menos cinco y más cinco G">
        <defs>
          <radialGradient id="housingGrad" cx="45%" cy="36%" r="70%">
            <stop offset="0" stop-color="#909294"/>
            <stop offset="1" stop-color="#686a6c"/>
          </radialGradient>
          <radialGradient id="dialGrad" cx="42%" cy="35%" r="72%">
            <stop offset="0" stop-color="#55575a"/>
            <stop offset="1" stop-color="#3b3d40"/>
          </radialGradient>
          <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
          </filter>
        </defs>

        <!-- Carcasa exterior octogonal -->
        <polygon
          points="118,24 382,24 476,118 476,382 382,476 118,476 24,382 24,118"
          fill="url(#housingGrad)"
          stroke="var(--housing-edge)"
          stroke-width="4" />

        <!-- Tornillos -->
        <g fill="#f4f4f4" stroke="#cfcfcf" stroke-width="2">
          <circle cx="86" cy="72" r="13"/>
          <circle cx="414" cy="72" r="13"/>
          <circle cx="414" cy="428" r="13"/>
          <circle cx="86" cy="428" r="13"/>
        </g>

        <!-- Esfera -->
        <circle cx="250" cy="250" r="195" fill="url(#dialGrad)" stroke="#d2d2d2" stroke-width="5" filter="url(#innerShadow)"/>
        <circle cx="250" cy="250" r="184" fill="none" stroke="#777a7d" stroke-width="2"/>

        <!-- Marcas y números generados por JavaScript -->
        <g id="ticks"></g>
        <g id="labels"></g>

        <!-- Texto -->
        <text x="250" y="178" text-anchor="middle" fill="#f4f4f4" font-size="17" font-weight="500">ACCELERATION</text>
        <text x="250" y="199" text-anchor="middle" fill="#f4f4f4" font-size="16">G UNITS</text>

        <!-- Aguja -->
        <g id="needleGroup" class="needle">
          <polygon points="101,245 250,240 250,260 101,255" fill="var(--needle)"/>
          <polygon points="88,250 111,240 111,260" fill="var(--needle)"/>
        </g>

        <!-- Eje central -->
        <circle cx="250" cy="250" r="25" fill="#5d6063" stroke="#303236" stroke-width="5"/>
        <circle cx="250" cy="250" r="10" fill="#44474a"/>

        <!-- Botón decorativo -->
        <g>
          <circle cx="98" cy="389" r="36" fill="#707276" stroke="#b9b9b9" stroke-width="2"/>
          <text x="98" y="379" text-anchor="middle" fill="#ededed" font-size="10">PUSH</text>
          <text x="98" y="392" text-anchor="middle" fill="#ededed" font-size="10">TO</text>
          <text x="98" y="405" text-anchor="middle" fill="#ededed" font-size="10">SET</text>
        </g>
      </svg>
    </div>

    <section class="controls" aria-label="Control del acelerómetro">
      <div class="readout">
        <span id="valueText">0.0</span><span class="unit">G</span>
      </div>
      <input id="gSlider" type="range" min="-5" max="5" step="0.1" value="0" aria-label="Aceleración en G" />
      <div class="range-labels"><span>−5 G</span><span>0 G</span><span>+5 G</span></div>
    </section>
  </main>

  <script>
    const svgNS = 'http://www.w3.org/2000/svg';
    const ticksGroup = document.getElementById('ticks');
    const labelsGroup = document.getElementById('labels');
    const needle = document.getElementById('needleGroup');
    const slider = document.getElementById('gSlider');
    const valueText = document.getElementById('valueText');

    const cx = 250;
    const cy = 250;
    const startAngle = 130;  // -5 G, abajo a la izquierda
    const endAngle = 410;    // +5 G, abajo a la derecha

    function polar(radius, angleDeg) {
      const a = angleDeg * Math.PI / 180;
      return {
        x: cx + radius * Math.cos(a),
        y: cy + radius * Math.sin(a)
      };
    }

    function valueToAngle(value) {
      return startAngle + ((value + 5) / 10) * (endAngle - startAngle);
    }

    // 50 subdivisiones: una marca cada 0,2 G.
    for (let i = 0; i <= 50; i++) {
      const value = -5 + i * 0.2;
      const angle = valueToAngle(value);
      const isMajor = i % 5 === 0;      // cada 1 G
      const isMedium = i % 5 === 0 || i % 5 === 2 || i % 5 === 3;
      const outer = polar(177, angle);
      const inner = polar(isMajor ? 147 : (isMedium ? 155 : 161), angle);

      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', inner.x);
      line.setAttribute('y1', inner.y);
      line.setAttribute('x2', outer.x);
      line.setAttribute('y2', outer.y);
      line.setAttribute('stroke', '#f4f4f4');
      line.setAttribute('stroke-width', isMajor ? 6 : 3.2);
      line.setAttribute('stroke-linecap', 'round');
      ticksGroup.appendChild(line);
    }

    // Etiquetas enteras de -5 a +5.
    for (let value = -5; value <= 5; value++) {
      const angle = valueToAngle(value);
      const p = polar(124, angle);
      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', p.x);
      text.setAttribute('y', p.y + 7);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', '#f4f4f4');
      text.setAttribute('font-size', value === 0 ? '25' : '22');
      text.setAttribute('font-family', 'Arial, Helvetica, sans-serif');
      text.textContent = value;
      labelsGroup.appendChild(text);
    }

    function updateGauge() {
      const value = Number(slider.value);
      const angle = valueToAngle(value);

      // La aguja original apunta hacia la izquierda (180°).
      needle.style.transform = `rotate(${angle - 180}deg)`;
      valueText.textContent = `${value > 0 ? '+' : ''}${value.toFixed(1)}`;
    }

    slider.addEventListener('input', updateGauge);
    updateGauge();
  </script>
</body>
</html>
